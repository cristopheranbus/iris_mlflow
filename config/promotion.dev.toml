[policy]
name = "iris-development"
version = "1.0"
combination = "all"
require_approval = true
require_smoke_test = true

[[rules]]
name = "minimum_f1"
metric = "test_f1_weighted"
operator = ">="
value = 0.85

[[rules]]
name = "minimum_accuracy"
metric = "test_accuracy"
operator = ">="
value = 0.85

[[rules]]
name = "f1_vs_champion"
metric = "test_f1_weighted"
operator = ">="
baseline = "champion"
allowed_regression = 0.02

[[rules]]
name = "maximum_log_loss"
metric = "test_log_loss"
operator = "<="
value = 0.40
required = false
