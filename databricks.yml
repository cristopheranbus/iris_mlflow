bundle:
  name: iris_mlflow

variables:
  registered_model_name:
    description: Nombre completo del modelo de Unity Catalog.
    default: workspace.default.iris_classifier
  deployment_job_name:
    description: Nombre estable del Deployment Job conectado al modelo.
    default: model-deployment
  serving_endpoint_name:
    description: Endpoint de Model Serving aislado por ambiente.
    default: iris-classifier-dev
  production_service_principal:
    description: Application ID del service principal que ejecuta produccion.
    default: "00000000-0000-0000-0000-000000000000"
  operators_group:
    description: Grupo con permiso para operar ejecuciones del job.
    default: users
  promotion_profile:
    description: Perfil versionado que gobierna la promoción del modelo.
    default: dev
  inference_table_name:
    description: Tabla payload creada por Unity AI Gateway para observabilidad.
    default: workspace.default.iris_classifier_dev_payload

artifacts:
  iris_mlflow_tools:
    type: whl
    path: .
    build: uv build

sync:
  paths:
    - ./notebooks/training
    - ./deployment
    - ./src
    - ./config
    - ./ops

resources:
  jobs:
    model_deployment:
      name: ${var.deployment_job_name}
      description: Evalua, aprueba y despliega una version exacta del modelo registrado.
      max_concurrent_runs: 1
      parameters:
        - name: model_name
          default: ${var.registered_model_name}
        - name: model_version
          default: ""
        - name: endpoint_name
          default: ${var.serving_endpoint_name}
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - ${workspace.file_path}/dist/*.whl
      tasks:
        - task_key: evaluate_model
          environment_key: default
          notebook_task:
            notebook_path: ./deployment/evaluate_model.ipynb
            base_parameters:
              model_name: "{{job.parameters.model_name}}"
              model_version: "{{job.parameters.model_version}}"
              endpoint_name: "{{job.parameters.endpoint_name}}"
              promotion_profile: ${var.promotion_profile}
            source: WORKSPACE

        - task_key: Approval_Check
          environment_key: default
          depends_on:
            - task_key: evaluate_model
          max_retries: 0
          notebook_task:
            notebook_path: ./deployment/approval.ipynb
            base_parameters:
              model_name: "{{job.parameters.model_name}}"
              model_version: "{{job.parameters.model_version}}"
              endpoint_name: "{{job.parameters.endpoint_name}}"
              promotion_profile: ${var.promotion_profile}
            source: WORKSPACE

        - task_key: deploy_model
          environment_key: default
          depends_on:
            - task_key: Approval_Check
          notebook_task:
            notebook_path: ./deployment/deploy_model.ipynb
            base_parameters:
              model_name: "{{job.parameters.model_name}}"
              model_version: "{{job.parameters.model_version}}"
              endpoint_name: "{{job.parameters.endpoint_name}}"
              promotion_profile: ${var.promotion_profile}
            source: WORKSPACE

    connect_deployment_job:
      name: ${var.deployment_job_name}-connect
      description: Conecta el job administrado por el bundle con el modelo registrado.
      max_concurrent_runs: 1
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - ${workspace.file_path}/dist/*.whl
      tasks:
        - task_key: connect_deployment_job
          environment_key: default
          notebook_task:
            notebook_path: ./deployment/create_deployment_job.ipynb
            base_parameters:
              model_name: ${var.registered_model_name}
              deployment_job_id: ${resources.jobs.model_deployment.id}
              endpoint_name: ${var.serving_endpoint_name}
            source: WORKSPACE

    model_monitoring:
      name: ${var.deployment_job_name}-monitoring
      description: Evalua salud operacional sin modificar el alias Champion.
      max_concurrent_runs: 1
      parameters:
        - name: endpoint_name
          default: ${var.serving_endpoint_name}
        - name: inference_table
          default: ${var.inference_table_name}
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - ${workspace.file_path}/dist/*.whl
      tasks:
        - task_key: monitor_endpoint
          environment_key: default
          spark_python_task:
            python_file: ./ops/databricks/monitor_endpoint.py
            parameters:
              - --endpoint-name
              - "{{job.parameters.endpoint_name}}"
              - --inference-table
              - "{{job.parameters.inference_table}}"

targets:
  dev:
    default: true
    mode: development
    variables:
      registered_model_name: workspace.default.iris_classifier_dev
      deployment_job_name: model-deployment-dev
      serving_endpoint_name: iris-classifier-dev
      promotion_profile: dev
      inference_table_name: workspace.default.iris_classifier_dev_payload

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: ${var.production_service_principal}
    variables:
      registered_model_name: workspace.default.iris_classifier
      deployment_job_name: model-deployment
      serving_endpoint_name: iris-classifier
      promotion_profile: prod
      inference_table_name: workspace.default.iris_classifier_payload
    resources:
      jobs:
        model_deployment:
          permissions:
            - group_name: ${var.operators_group}
              level: CAN_MANAGE_RUN
