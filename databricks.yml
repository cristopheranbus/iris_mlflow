bundle:
  name: iris_mlflow

variables:
  registered_model_name:
    description: Nombre completo del modelo de Unity Catalog.
    default: workspace.default.iris_classifier
  deployment_job_name:
    description: Nombre estable del Deployment Job conectado al modelo.
    default: model-deployment
  production_service_principal:
    description: Application ID del service principal que ejecuta produccion.
    default: "00000000-0000-0000-0000-000000000000"
  operators_group:
    description: Grupo con permiso para operar ejecuciones del job.
    default: users

artifacts:
  iris_mlflow_tools:
    type: whl
    path: ./tools
    build: uv build

sync:
  include:
    - config/training.toml
  paths:
    - ./deployment
    - ./tools/src
    - ./config

resources:
  jobs:
    model_deployment:
      name: ${var.deployment_job_name}
      description: Evalua, aprueba y despliega una version exacta del modelo registrado.
      max_concurrent_runs: 1
      parameters:
        - name: model_name
          default: ${var.registered_model_name}
        - name: model_version
          default: ""
      tasks:
        - task_key: evaluate_model
          notebook_task:
            notebook_path: ./deployment/evaluate_model.ipynb
            base_parameters:
              model_name: "{{job.parameters.model_name}}"
              model_version: "{{job.parameters.model_version}}"
            source: WORKSPACE
          libraries:
            - whl: ./tools/dist/*.whl

        - task_key: Approval_Check
          depends_on:
            - task_key: evaluate_model
          max_retries: 0
          notebook_task:
            notebook_path: ./deployment/approval.ipynb
            base_parameters:
              model_name: "{{job.parameters.model_name}}"
              model_version: "{{job.parameters.model_version}}"
            source: WORKSPACE
          libraries:
            - whl: ./tools/dist/*.whl

        - task_key: deploy_model
          depends_on:
            - task_key: Approval_Check
          notebook_task:
            notebook_path: ./deployment/deploy_model.ipynb
            base_parameters:
              model_name: "{{job.parameters.model_name}}"
              model_version: "{{job.parameters.model_version}}"
            source: WORKSPACE
          libraries:
            - whl: ./tools/dist/*.whl

    connect_deployment_job:
      name: ${var.deployment_job_name}-connect
      description: Conecta el job administrado por el bundle con el modelo registrado.
      max_concurrent_runs: 1
      tasks:
        - task_key: connect_deployment_job
          notebook_task:
            notebook_path: ./deployment/create_deployment_job.ipynb
            base_parameters:
              model_name: ${var.registered_model_name}
              deployment_job_id: ${resources.jobs.model_deployment.id}
            source: WORKSPACE
          libraries:
            - whl: ./tools/dist/*.whl

targets:
  dev:
    default: true
    mode: development
    variables:
      registered_model_name: workspace.default.iris_classifier
      deployment_job_name: model-deployment-dev

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: ${var.production_service_principal}
    variables:
      registered_model_name: workspace.default.iris_classifier
      deployment_job_name: model-deployment
    resources:
      jobs:
        model_deployment:
          permissions:
            - group_name: ${var.operators_group}
              level: CAN_MANAGE_RUN
