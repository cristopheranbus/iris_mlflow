[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "databricks-endpoint-client"
version = "0.1.0"
description = "Cliente REST para consumir endpoints de Databricks Model Serving."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.8",
    "mlflow>=3.1,<4",
    "numpy>=1.26",
    "pandas>=2.2",
    "requests>=2.32",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
]

[project.optional-dependencies]
databricks = ["mlflow[databricks]>=3.1,<4"]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "pytest>=8.3",
    "ruff>=0.6",
    "types-requests>=2.32",
]

[tool.hatch.build.targets.wheel]
packages = ["src/databricks_endpoint_client", "src/iris_mlflow_utils"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
plugins = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
