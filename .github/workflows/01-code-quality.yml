name: 01 · Code quality and package validation

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: code-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-suite:
    name: Test suite (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: full-ubuntu
            os: ubuntu-latest
            coverage: true
          - name: unit-contract-windows
            os: windows-latest
            coverage: false
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.21"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync test dependencies
        run: uv sync --locked --no-default-groups --group test
      - name: Run full test suite with coverage
        if: matrix.coverage
        run: >-
          uv run --no-sync pytest
          --cov=iris_mlflow_utils
          --cov-branch
          --cov-report=term-missing
          --cov-report=json:.local/coverage/coverage.json
          --cov-fail-under=85
      - name: Run unit and contract suites on Windows
        if: ${{ !matrix.coverage }}
        run: uv run --no-sync pytest -m "unit or contract"
      - name: Enforce statement and branch coverage
        if: matrix.coverage
        run: >-
          uv run --no-sync python quality/check_coverage.py
          .local/coverage/coverage.json
          --min-statements 90
          --min-branches 85

  static-analysis:
    name: Static analysis (Ruff and mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.21"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync static analysis dependencies
        run: uv sync --locked --no-default-groups --group test --group quality
      - name: Run Ruff lint
        run: uv run --no-sync ruff check --config quality/ruff.toml src tests quality ops
      - name: Verify Ruff formatting
        run: uv run --no-sync ruff format --check --config quality/ruff.toml src tests quality ops
      - name: Run mypy strict type checking
        run: >-
          uv run --no-sync mypy
          --config-file quality/mypy.ini
          src tests quality ops

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.21"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync audit dependencies
        run: uv sync --locked --no-default-groups --group quality
      - name: Run pip-audit
        run: uv run --no-sync pip-audit
      - name: Generate CycloneDX SBOM
        run: |
          mkdir -p .local/sbom
          uv run --no-sync pip-audit --format cyclonedx-json --output .local/sbom/cyclonedx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cyclonedx-sbom
          path: .local/sbom/cyclonedx.json
          if-no-files-found: error

  package-build:
    name: Build and smoke-test package
    needs: [test-suite, static-analysis, dependency-audit]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.21"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Build wheel and source distribution
        run: uv build
      - name: Install and smoke-test built wheel
        run: python quality/smoke_wheel.py --python 3.12
      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
      - name: Attest build provenance
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: dist/*
