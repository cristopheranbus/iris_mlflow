name: 01 · Code quality and package validation

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: code-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-suite:
    name: Test suite (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: full-ubuntu
            os: ubuntu-latest
            coverage: true
          - name: unit-contract-windows
            os: windows-latest
            coverage: false
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          version: "0.11.21"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync test dependencies
        run: uv sync --locked --no-default-groups --group test
      - name: Run full test suite with coverage
        if: matrix.coverage
        run: >-
          uv run --no-sync pytest
          --cov=iris_mlflow_utils
          --cov-branch
          --cov-report=term-missing
          --cov-report=json:.local/coverage/coverage.json
          --cov-fail-under=85
      - name: Run unit and contract suites on Windows
        if: ${{ !matrix.coverage }}
        run: uv run --no-sync pytest -m "unit or contract"
      - name: Enforce statement and branch coverage
        if: matrix.coverage
        run: >-
          uv run --no-sync python quality/check_coverage.py
          .local/coverage/coverage.json
          --min-statements 90
          --min-branches 85

  static-analysis:
    name: Static analysis (Ruff and mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          version: "0.11.21"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync static analysis dependencies
        run: uv sync --locked --no-default-groups --group test --group quality
      - name: Run Ruff lint
        run: uv run --no-sync ruff check --config quality/ruff.toml src tests quality ops
      - name: Verify Ruff formatting
        run: uv run --no-sync ruff format --check --config quality/ruff.toml src tests quality ops
      - name: Run mypy strict type checking
        run: >-
          uv run --no-sync mypy
          --config-file quality/mypy.ini
          src tests quality ops

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          version: "0.11.21"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync audit dependencies
        run: uv sync --locked --no-default-groups --group quality
      - name: Run pip-audit
        # MLflow 3.15 currently constrains cryptography below the fixed release.
        # Keep this single exception visible; every other advisory still fails CI.
        run: uv run --no-sync pip-audit --ignore-vuln PYSEC-2026-3552

  package-build:
    name: Build and smoke-test package
    needs: [test-suite, static-analysis, dependency-audit]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          version: "0.11.21"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Build wheel and source distribution
        run: uv build
      - name: Install and smoke-test built wheel
        run: python quality/smoke_wheel.py --python 3.12
