name: Tests and quality checks

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests-and-quality:
    name: Tests and quality checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: tools

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.11.21"
          enable-cache: true
          cache-dependency-glob: tools/uv.lock

      - name: Install project dependencies
        run: uv sync --locked --dev

      - name: Run unit tests
        run: uv run pytest

      - name: Check lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Check types
        run: uv run mypy

      - name: Audit Python dependencies
        # MLflow 3.15 currently constrains cryptography below the fixed release.
        # Keep this single exception visible; every other advisory still fails CI.
        run: uv run pip-audit --ignore-vuln PYSEC-2026-3552

      - name: Build package
        run: uv build
