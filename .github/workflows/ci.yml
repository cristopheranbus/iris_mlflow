name: Tests and quality checks

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests-and-quality:
    name: Tests and quality checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: tools

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          version: "0.11.21"
          enable-cache: true
          cache-dependency-glob: tools/uv.lock

      - name: Install project dependencies
        run: uv sync --locked --dev

      - name: Run unit tests
        run: uv run pytest

      - name: Check lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Check types
        run: uv run mypy

      - name: Audit Python dependencies
        # MLflow 3.15 currently constrains cryptography below the fixed release.
        # Keep this single exception visible; every other advisory still fails CI.
        run: uv run pip-audit --ignore-vuln PYSEC-2026-3552

      - name: Build package
        run: uv build
